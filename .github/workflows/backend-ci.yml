name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: PHP syntax check
        id: php_syntax
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          while IFS= read -r -d '' file; do
            echo "CHECK PHP: $file"
            if ! php -l "$file"; then
              failed=1
            fi
          done < <(find plugin/woogit-backend -type f -name '*.php' -print0)
          exit "$failed"

      - name: Behavioral lifecycle tests
        id: behavioral
        continue-on-error: true
        shell: bash
        run: bash tests/run_behavioral.sh

      - name: Web login Site URL identity test
        id: web_login
        continue-on-error: true
        shell: bash
        run: bash tests/web_login_identity.sh

      - name: Backend security invariants
        id: backend_security
        continue-on-error: true
        shell: bash
        run: bash tests/security_invariants.sh

      - name: Proxy security invariants
        id: proxy_security
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          proxy='plugin/woogit-backend/src/WooCommerceProxy.php'
          controller='plugin/woogit-backend/src/RestController.php'
          billing='plugin/woogit-backend/src/BillingController.php'
          billing_service='plugin/woogit-backend/src/BillingService.php'
          policy='plugin/woogit-backend/src/ProxyPolicy.php'
          idempotency='plugin/woogit-backend/src/IdempotencyService.php'
          operations='plugin/woogit-backend/src/OperationService.php'
          if grep -Eq 'consumer_(key|secret).*query|query.*consumer_(key|secret)' "$proxy"; then echo 'FAIL: customer consumer credentials must not be placed in query parameters'; exit 1; fi
          grep -Eq 'Idempotency-Key' "$controller"
          grep -Eq 'Idempotency-Key' "$billing"
          grep -Eq 'createCheckout\(' "$billing"
          grep -Eq 'findCheckoutByIdempotencyKey' "$billing_service"
          grep -Eq 'wp_safe_remote_request' "$proxy"
          grep -Eq 'https' "$policy"
          grep -Eq "state.*pending|state.*unknown" "$idempotency"
          grep -Eq 'markUnknown' "$operations"
          grep -Eq "'proxy'" "$controller"
          grep -Eq 'ALLOWED_MEDIA_PATH' "$policy"

      - name: Build installable WordPress plugin ZIP
        id: build_zip
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(awk -F': ' '/^ \* Version: / {print $2; exit}' plugin/woogit-backend/woogit-backend.php)
          test -n "$VERSION"
          rm -rf dist
          mkdir -p dist
          zip -qr "dist/woogit-backend-${VERSION}.zip" plugin/woogit-backend
          unzip -t "dist/woogit-backend-${VERSION}.zip"
          unzip -l "dist/woogit-backend-${VERSION}.zip" | grep -Eq 'plugin/woogit-backend/woogit-backend\.php$'
          echo "Built dist/woogit-backend-${VERSION}.zip"

      - name: Upload installable plugin ZIP
        id: upload_zip
        if: ${{ always() && steps.build_zip.outcome == 'success' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: woogit-backend-plugin
          path: dist/woogit-backend-*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Final CI gate
        if: ${{ always() }}
        shell: bash
        run: |
          failed=0

          check_step() {
            local name="$1"
            local outcome="$2"
            if [ "$outcome" != "success" ]; then
              echo "FAIL: $name ($outcome)"
              failed=1
            else
              echo "PASS: $name"
            fi
          }

          check_step 'PHP syntax check' '${{ steps.php_syntax.outcome }}'
          check_step 'Behavioral lifecycle tests' '${{ steps.behavioral.outcome }}'
          check_step 'Web login Site URL identity test' '${{ steps.web_login.outcome }}'
          check_step 'Backend security invariants' '${{ steps.backend_security.outcome }}'
          check_step 'Proxy security invariants' '${{ steps.proxy_security.outcome }}'
          check_step 'Build installable WordPress plugin ZIP' '${{ steps.build_zip.outcome }}'

          if [ '${{ steps.build_zip.outcome }}' = 'success' ]; then
            check_step 'Upload installable plugin ZIP' '${{ steps.upload_zip.outcome }}'
          else
            echo 'SKIP: Upload installable plugin ZIP (build failed)'
          fi

          if [ "$failed" -ne 0 ]; then
            echo
            echo 'CI FAILED: one or more checks failed. All checks were allowed to run; see the individual steps above for every failure.'
            exit 1
          fi

          echo
          echo 'CI PASSED: all checks passed.'
