name: Theme CI
on:
  push:
    branches: [main, theme-v1-implementation]
    paths: ['theme/woogit/**', 'tests/theme/**', '.github/workflows/theme-ci.yml']
  pull_request:
    paths: ['theme/woogit/**', 'tests/theme/**', '.github/workflows/theme-ci.yml']
jobs:
  php-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          set -uo pipefail; status=0
          while IFS= read -r -d '' file; do php -l "$file" || status=1; done < <(find theme/woogit -type f -name '*.php' -print0)
          exit "$status"
  boundary-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Theme boundary checks
        run: |
          set -uo pipefail; status=0
          if grep -RInE 'wp_remote_(get|post|request)\(|\$wpdb|WC_[A-Za-z_]+' theme/woogit/templates theme/woogit/template-parts; then echo 'Theme templates/template-parts contain forbidden infrastructure.'; status=1; fi
          # Only executable Theme code is checked here. Presentation copy may document the App/Web session distinction.
          if grep -RInE 'activate-session|X-WooGit-Session' theme/woogit/inc theme/woogit/assets/js theme/woogit/assets/css --include='*.php' --include='*.js' --include='*.css'; then echo 'Theme executable code must not consume App Session or activate-session.'; status=1; fi
          bash tests/theme/test_theme_static.sh || status=1
          exit "$status"
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          set -uo pipefail; status=0
          while IFS= read -r -d '' file; do node --check "$file" || status=1; done < <(find theme/woogit/assets/js -type f -name '*.js' -print0)
          exit "$status"
  theme-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required Theme structure
        run: |
          set -uo pipefail; status=0
          for file in style.css functions.php header.php footer.php index.php 404.php front-page.php page-pricing.php inc/api/client.php inc/auth/session.php inc/portal/data.php inc/commerce/adapter.php inc/admin/theme-management/settings.php inc/admin/theme-management/meta.php inc/admin/theme-management/admin.php template-parts/public-page.php templates/public/home.php templates/public/payment-result.php templates/auth/login.php templates/auth/register.php templates/portal/overview.php templates/portal/subscription.php templates/portal/billing.php templates/portal/payments.php templates/portal/connected-site.php templates/portal/account-security.php; do [[ -f "theme/woogit/$file" ]] || { echo "Missing required Theme file: $file"; status=1; }; done
          for dir in templates templates/public templates/auth templates/portal template-parts; do [[ -d "theme/woogit/$dir" ]] || { echo "Missing required Theme directory: $dir"; status=1; }; done
          grep -q "Theme Name: WooGit" theme/woogit/style.css || { echo 'Theme Name missing'; status=1; }
          grep -q "wp_head" theme/woogit/header.php || { echo 'wp_head missing'; status=1; }
          grep -q "wp_footer" theme/woogit/footer.php || { echo 'wp_footer missing'; status=1; }
          exit "$status"
  build:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - name: Build installable Theme ZIP
        run: |
          set -euo pipefail
          rm -rf dist woogit-theme-v1.zip; mkdir -p dist; cp -a theme/woogit dist/woogit
          find dist/woogit -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          if find dist/woogit -type l -print -quit | grep -q .; then echo 'ZIP source contains symlink'; exit 1; fi
          (cd dist && zip -qr ../woogit-theme-v1.zip woogit)
      - name: Strict ZIP validation
        run: |
          set -euo pipefail
          unzip -Z1 woogit-theme-v1.zip > /tmp/theme-zip.txt
          grep -qx 'woogit/' /tmp/theme-zip.txt
          grep -qx 'woogit/style.css' /tmp/theme-zip.txt
          grep -q '^woogit/templates/public/home.php$' /tmp/theme-zip.txt
          grep -q '^woogit/templates/public/payment-result.php$' /tmp/theme-zip.txt
          grep -q '^woogit/templates/auth/register.php$' /tmp/theme-zip.txt
          grep -q '^woogit/templates/portal/overview.php$' /tmp/theme-zip.txt
          grep -q '^woogit/page-pricing.php$' /tmp/theme-zip.txt
          if grep -Eiq '(^|/)(plugin|plugins|node_modules|\.git|tests|docs|\.github)(/|$)' /tmp/theme-zip.txt; then echo 'ZIP contains forbidden non-theme content'; exit 1; fi
          if grep -Eiq '(^|/)\.[^/]+($|/)' /tmp/theme-zip.txt; then echo 'ZIP contains hidden/unrelated files'; exit 1; fi
          unzip -tq woogit-theme-v1.zip
      - name: Upload Theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: woogit-theme-v1
          path: woogit-theme-v1.zip
          if-no-files-found: error
