name: Theme CI
on:
  push:
    branches: [main, theme-v1-implementation]
    paths: ['theme/woogit/**', '.github/workflows/theme-ci.yml']
  pull_request:
    paths: ['theme/woogit/**', '.github/workflows/theme-ci.yml']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PHP syntax
        run: |
          set -euo pipefail
          find theme/woogit -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Theme boundary checks
        run: |
          set -euo pipefail
          if grep -RInE 'wp_remote_(get|post|request)\(|\$wpdb|WC_[A-Za-z_]+' theme/woogit/templates theme/woogit/template-parts 2>/dev/null; then
            echo 'Theme templates/template-parts contain forbidden infrastructure.'
            exit 1
          fi
          if grep -RInE 'activate-session|X-WooGit-Session' theme/woogit 2>/dev/null; then
            echo 'Theme must not consume App Session or activate-session.'
            exit 1
          fi
